spring:
  application:
    name: koog-examples
  profiles:
    active: ${APP_ENV:dev}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

agent:
  model: ${AGENT_MODEL:gemini-2.0-flash-001}
  system-prompt: ${AGENT_SYSTEM_PROMPT:You are a helpful assistant. Please respond in Japanese.}

phase2:
  model: ${PHASE2_MODEL:gemini-2.0-flash-001}
  system-prompt: ${PHASE2_SYSTEM_PROMPT:あなたは様々なツールを使いこなす有能なアシスタントです。ユーザーの要求に応じて適切なツールを選択し、実行してください。}
  max-tokens: ${PHASE2_MAX_TOKENS:2048}
  temperature: ${PHASE2_TEMPERATURE:0.7}

api:
  google-api-key: ${GOOGLE_API_KEY:}
  openweather-api-key: ${OPENWEATHER_API_KEY:}
  news-api-key: ${NEWS_API_KEY:}
  openweather-base-url: ${API_OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
  news-api-base-url: ${API_NEWS_API_BASE_URL:https://newsapi.org/v2}

phase4:
  llm-model: ${PHASE4_LLM_MODEL:gemini-2.0-flash-001}
  temperature: ${PHASE4_TEMPERATURE:0.7}
  chrome-devtools:
    headless: ${PHASE4_CHROME_HEADLESS:true}
    startup-timeout: ${PHASE4_CHROME_STARTUP_TIMEOUT:3000}

phase5:
  model: ${PHASE5_MODEL:llama3-groq-tool-use:8b}
  system-prompt: ${PHASE5_SYSTEM_PROMPT:あなたは親切なアシスタントです。ユーザーの質問に対して正確かつ簡潔に日本語で回答してください。}
  temperature: ${PHASE5_TEMPERATURE:0.7}
  max-iterations: ${PHASE5_MAX_ITERATIONS:10}

ai:
  koog:
    ollama:
      enabled: true
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
